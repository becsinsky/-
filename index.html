            // ===== Person Management =====
            function addPerson() {
                const nameInput = document.getElementById('person-name');
                const name = nameInput.value.trim();

                if (!name) {
                    showToast('名前を入力してください', 'error');
                    nameInput.focus();
                    return;
                }

                if (persons.length >= 30) {
                    showToast('最大30人までです', 'error');
                    return;
                }

                if (persons.some(p => p.name === name)) {
                    showToast('同じ名前の人物が既に存在します', 'error');
                    return;
                }

                const gender = document.querySelector('#person-gender-options .gender-option.active').dataset.gender;
                const color = GENDER_COLORS[gender] || GENDER_COLORS.none;

                const person = {
                    id: nextPersonId++,
                    name: name,
                    color: color,
                    gender: gender,
                    photo: addPersonPhoto || null,
                    photoSize: addPersonPhoto ? addPersonPhotoSize : 35,
                    photoOriginal: addPersonPhotoOriginal || null,
                    photoCrop: addPersonPhoto ? { ...addPersonPhotoCrop } : { x: 0, y: 0, zoom: 100 },
                };

                persons.push(person);
                nameInput.value = '';
                nameInput.focus();

                // 写真リセット
                addPersonPhoto = null;
                addPersonPhotoSize = 35;
                addPersonPhotoOriginal = null;
                addPersonPhotoCrop = { x: 0, y: 0, zoom: 100 };
                const addPrev = document.getElementById('add-photo-preview');
                addPrev.style.backgroundImage = ''; addPrev.textContent = '📷';
                document.getElementById('btn-add-photo-clear').style.display = 'none';

                // 性別を男に戻す
                document.querySelectorAll('#person-gender-options .gender-option').forEach(o => o.classList.remove('active'));
                document.querySelector('#person-gender-options [data-gender="male"]').classList.add('active');

                saveData();
                renderAll();
                updateNetwork();
                showToast(`${name} を追加しました`, 'success');
            }

            function deletePerson(id) {
                const person = persons.find(p => p.id === id);
                if (!person) return;

                if (!confirm(`「${person.name}」を削除しますか？\n関連する関係もすべて削除されます。`)) return;

                // Remove related relations
                relations = relations.filter(r => r.fromId !== id && r.toId !== id);
                persons = persons.filter(p => p.id !== id);

                saveData();
                renderAll();
                updateNetwork();
                showToast(`${person.name} を削除しました`, 'info');
            }

            // ===== Auto-Direction Helper =====
            function isOneWayRelation(relType) {
                return ONE_WAY_KEYWORDS.some(kw => relType.includes(kw));
            }

            function autoSetDirection() {
                const relType = document.getElementById('rel-type').value.trim();
                const dirSelect = document.getElementById('rel-direction');
                if (isOneWayRelation(relType)) {
                    dirSelect.value = 'from-to';
                } else {
                    dirSelect.value = 'both';
                }
            }

            // ===== Relation Management =====
            function addRelation() {
                const fromId = parseInt(document.getElementById('rel-from').value);
                const toId = parseInt(document.getElementById('rel-to').value);
                const relType = document.getElementById('rel-type').value.trim();
                const direction = document.getElementById('rel-direction').value;

                if (!fromId || !toId) {
                    showToast('2人の人物を選択してください', 'error');
                    return;
                }

                if (fromId === toId) {
                    showToast('異なる人物を選択してください', 'error');
                    return;
                }

                if (!relType) {
                    showToast('関係の種類を入力してください', 'error');
                    return;
                }

                const relation = {
                    id: nextRelationId++,
                    fromId,
                    toId,
                    type: relType,
                    direction,
                    color: edgeColor(direction),
                };

                relations.push(relation);
                document.getElementById('rel-type').value = '';

                saveData();
                renderAll();
                updateNetwork();
                showToast('関係を追加しました', 'success');
            }

            function deleteRelation(id) {
                relations = relations.filter(r => r.id !== id);
                saveData();
                renderAll();
                updateNetwork();
                showToast('関係を削除しました', 'info');
            }

            // ===== Rendering =====
            function renderAll() {
                renderPersonList();
                renderRelationList();
                updatePersonSelects();
                document.getElementById('person-count').textContent = persons.length;
                document.getElementById('relation-count').textContent = relations.length;
            }

            function renderPersonList() {
                const container = document.getElementById('person-list');

                if (persons.length === 0) {
                    container.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">👥</div>
                    <div>まだメンバーがいません</div>
                </div>`;
                    return;
                }

                container.innerHTML = persons.map(p => `
            <div class="list-item">
                <div class="list-item-left">
                    <div class="person-dot" style="background: ${p.color};"></div>
                    <span class="person-name">${escapeHtml(p.name)}</span>
                </div>
                <div style="display: flex; gap: 4px;">
                    <button class="btn btn-secondary btn-sm delete-btn" onclick="app.openEditNodeModal(${p.id})" title="編集">✏️</button>
                    <button class="btn btn-danger btn-sm delete-btn" onclick="app.deletePerson(${p.id})" title="削除">✕</button>
                </div>
            </div>
        `).join('');
            }

            function renderRelationList() {
                const container = document.getElementById('relation-list');

                if (relations.length === 0) {
                    container.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">🔗</div>
                    <div>まだ関係がありません</div>
                </div>`;
                    return;
                }

                container.innerHTML = relations.map(r => {
                    const from = persons.find(p => p.id === r.fromId);
                    const to = persons.find(p => p.id === r.toId);
                    if (!from || !to) return '';

                    const arrow = r.direction === 'both' ? '⟷' : '→';
                    return `
                <div class="list-item">
                    <div class="relation-info">
                        <span class="relation-people">${escapeHtml(from.name)} ${arrow} ${escapeHtml(to.name)}</span>
                        <span class="relation-type">
                            <span class="relation-line-preview" style="background: ${r.color};"></span>
                            ${escapeHtml(r.type)}
                        </span>
                    </div>
                    <div style="display: flex; gap: 4px;">
                        <button class="btn btn-secondary btn-sm delete-btn" onclick="app.openEditEdgeModal(${r.id})" title="編集">✏️</button>
                        <button class="btn btn-danger btn-sm delete-btn" onclick="app.deleteRelation(${r.id})" title="削除">✕</button>
                    </div>
                </div>
            `;
                }).join('');
            }

            function updatePersonSelects() {
                const fromSelect = document.getElementById('rel-from');
                const toSelect = document.getElementById('rel-to');
                const currentFrom = fromSelect.value;
                const currentTo = toSelect.value;

                const options = '<option value="">選択...</option>' +
                    persons.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');

                fromSelect.innerHTML = options;
                toSelect.innerHTML = options;

                fromSelect.value = currentFrom;
                toSelect.value = currentTo;
            }

            // ===== vis.js Network =====
            function initNetwork() {
                const container = document.getElementById('network-graph');
                nodes = new vis.DataSet();
                edges = new vis.DataSet();

                const options = {
                    nodes: {
                        shape: 'dot',
                        size: 28,
                        font: {
                            size: 14,
                            color: '#e8e6f0',
                            face: 'Noto Sans JP, sans-serif',
                            strokeWidth: 3,
                            strokeColor: '#0f0f1a',
                        },
                        borderWidth: 3,
                        borderWidthSelected: 4,
                        shadow: {
                            enabled: true,
                            color: 'rgba(0,0,0,0.4)',
                            size: 10,
                            x: 0,
                            y: 3,
                        },
                    },
                    edges: {
                        width: 2.5,
                        font: {
                            size: 12,
                            color: '#9d9bb8',
                            face: 'Noto Sans JP, sans-serif',
                            strokeWidth: 2,
                            strokeColor: '#0f0f1a',
                            align: 'top',
                        },
                        smooth: false,
                        shadow: {
                            enabled: true,
                            color: 'rgba(0,0,0,0.2)',
                            size: 5,
                            x: 0,
                            y: 2,
                        },
                        selectionWidth: 2,
                    },
                    physics: {
                        enabled: true,
                        solver: 'forceAtlas2Based',
                        forceAtlas2Based: {
                            gravitationalConstant: -100,
                            centralGravity: 0.01,
                            springLength: 150,
                            springConstant: 0.08,
                            damping: 0.4,
                            avoidOverlap: 1,
                        },
                        stabilization: {
                            iterations: 500,
                            updateInterval: 50,
                            fit: true,
                        },
                        adaptiveTimestep: true,
                    },
                    interaction: {
                        hover: true,
                        tooltipDelay: 200,
                        dragNodes: true,
                        dragView: true,
                        zoomView: true,
                        navigationButtons: false,
                        keyboard: false,
                    },
                    layout: {
                        improvedLayout: true,
                    },
                };

                network = new vis.Network(container, { nodes, edges }, options);

                // Stop physics after stabilization to allow free dragging
                network.on('stabilizationIterationsDone', () => {
                    // Optionally let the physics run a little more then stop
                });

                // ===== Double-click editing =====
                network.on('doubleClick', function (params) {
                    if (params.nodes.length > 0) {
                        const nodeId = params.nodes[0];
                        openEditNodeModal(nodeId);
                    } else if (params.edges.length > 0) {
                        const edgeId = params.edges[0];
                        const edgeData = edges.get(edgeId);
                        if (!edgeData) return;

                        // エッジ（線または文字）がクリックされたら関係を編集
                        openRelationEditorForPair(edgeData.from, edgeData.to);
                    }
                });

                // ===== シングルクリック: 2ノード順番クリックで関係追加、エッジクリックで関係編集 =====
                network.on('click', function (params) {
                    if (params.nodes.length > 0) {
                        const clickedNodeId = params.nodes[0];

                        if (firstSelectedNode === null) {
                            // 1人目選択
                            firstSelectedNode = clickedNodeId;
                            network.selectNodes([clickedNodeId]);
                            const person = persons.find(p => p.id === clickedNodeId);
                            const hint = document.getElementById('selection-hint');
                            document.getElementById('selection-hint-text').textContent =
                                `👆 「${person ? person.name : ''}」を選択中 — 2人目をクリック`;
                            hint.classList.add('active');

                        } else if (firstSelectedNode === clickedNodeId) {
                            // 同じノードを再クリック → 選択解除
                            clearNodeSelection();

                        } else {
                            // 2人目選択 → 新規追加サイドバーをポップアップ
                            const secondNodeId = clickedNodeId;
                            openAddRelationSidebar(firstSelectedNode, secondNodeId);
                            clearNodeSelection();
                        }
                    } else if (params.edges.length > 0) {
                        // エッジ（線・文字）をシングルクリックでも編集モーダルを開く
                        if (firstSelectedNode !== null) {
                            clearNodeSelection();
                        }
                        const edgeId = params.edges[0];
                        const edgeData = edges.get(edgeId);
                        if (edgeData) {
                            openRelationEditorForPair(edgeData.from, edgeData.to);
                        }
                    } else {
                        // 空白クリック → 選択解除
                        if (firstSelectedNode !== null) {
                            clearNodeSelection();
                        }
                    }
                });

                updateNetwork();
            }

            // ===== Node Selection Helpers =====
            function clearNodeSelection() {
                firstSelectedNode = null;
                document.getElementById('selection-hint').classList.remove('active');
                if (network) network.unselectAll();
            }

            function openEditNodeModal(nodeId) {
                const person = persons.find(p => p.id === nodeId);
                if (!person) return;
                document.getElementById('edit-node-id').value = nodeId;
                document.getElementById('edit-node-name').value = person.name;

                // Gender
                const gender = person.gender || 'none';
                document.querySelectorAll('#edit-node-gender-options .gender-option').forEach(opt => {
                    opt.classList.toggle('active', opt.dataset.gender === gender);
                });

                // Photo
                editPersonPhoto = person.photo || null;
                editPersonPhotoSize = person.photoSize || 35;
                editPersonPhotoOriginal = person.photoOriginal || person.photo || null;
                editPersonPhotoCrop = person.photoCrop ? { ...person.photoCrop } : { x: 0, y: 0, zoom: 100 };
                const editPrev = document.getElementById('edit-photo-preview');
                if (editPersonPhoto) {
                    editPrev.style.cssText += ';background-image:url(' + editPersonPhoto + ');background-size:cover;background-position:center;';
                    editPrev.textContent = '';
                } else {
                    editPrev.style.backgroundImage = ''; editPrev.textContent = '📷';
                }

                document.getElementById('edit-node-modal').classList.add('active');
                setTimeout(() => document.getElementById('edit-node-name').focus(), 100);
            }

            function openEditEdgeModal(edgeId) {
                const relation = relations.find(r => r.id === edgeId);
                if (!relation) return;
                document.getElementById('edit-edge-id').value = edgeId;
                document.getElementById('edit-edge-type').value = relation.type;
                document.getElementById('edit-edge-direction').value = relation.direction;
                // 人物名を表示
                const fromPerson = persons.find(p => p.id === relation.fromId);
                const toPerson = persons.find(p => p.id === relation.toId);
                const infoEl = document.getElementById('edit-edge-people-info');
                if (fromPerson && toPerson) {
                    const arrow = relation.direction === 'both' ? '⟷' : '→';
                    infoEl.textContent = `${fromPerson.name} ${arrow} ${toPerson.name}`;
                } else {
                    infoEl.textContent = '';
                }
                document.getElementById('edit-edge-modal').classList.add('active');
                setTimeout(() => document.getElementById('edit-edge-type').focus(), 100);
            }

            function openAddRelationSidebar(nodeIdA, nodeIdB) {
                document.getElementById('rel-from').value = nodeIdA;
                document.getElementById('rel-to').value = nodeIdB;
                // 関係タブに切り替え
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.querySelector('[data-tab="tab-relation"]').classList.add('active');
                document.getElementById('tab-relation').classList.add('active');

                // サイドバーを強制的に開く（モバイル等の分割画面対応）
                document.getElementById('sidebar').classList.add('open');

                document.getElementById('rel-type').focus();
                const personA = persons.find(p => p.id === nodeIdA);
                const personB = persons.find(p => p.id === nodeIdB);
                showToast(`${personA?.name} と ${personB?.name} の関係を追加してください`, 'info');
            }

            function openRelationEditorForPair(nodeIdA, nodeIdB) {
                // この2人間の既存の関係を探す
                const existingRelations = relations.filter(r =>
                    (r.fromId === nodeIdA && r.toId === nodeIdB) ||
                    (r.fromId === nodeIdB && r.toId === nodeIdA)
                );

                if (existingRelations.length === 1) {
                    // 1つだけ → その関係の編集モーダルを開く
                    openEditEdgeModal(existingRelations[0].id);
                } else if (existingRelations.length > 1) {
                    // 複数あるなら最初の1つを編集（ユーザーが線をダブルクリックで個別に編集可能）
                    openEditEdgeModal(existingRelations[0].id);
                    showToast(`この2人には${existingRelations.length}件の関係があります。線のラベルをダブルクリックで個別に編集できます`, 'info');
                } else {
                    // 関係がない → サイドバーで追加
                    openAddRelationSidebar(nodeIdA, nodeIdB);
                }
            }

            function updateNetwork() {
                if (!nodes || !edges) return;

                // Build node data
                const nodeData = persons.map(p => {
                    const nd = {
                        id: p.id,
                        label: p.name,
                        color: {
                            background: p.color,
                            border: adjustColor(p.color, -30),
                            highlight: { background: adjustColor(p.color, 20), border: p.color },
                            hover: { background: adjustColor(p.color, 10), border: p.color },
                        },
                    };
                    if (p.photo) {
                        nd.shape = 'circularImage';
                        nd.image = p.photo;
                        nd.size = p.photoSize || 35;
                        nd.borderWidth = 3;
                        nd.color.border = p.color;
                    } else {
                        nd.shape = 'dot';
                        nd.size = 28;
                    }
                    return nd;
                });

                // 同じペア間のエッジをグループ化
                const pairMap = new Map(); // 'min-max' -> [{relation, idx}]
                relations.forEach(r => {
                    const key = Math.min(r.fromId, r.toId) + '-' + Math.max(r.fromId, r.toId);
                    if (!pairMap.has(key)) pairMap.set(key, []);
                    pairMap.get(key).push(r);
                });

                // Build edge data: 同じペアの複数関係は1本のエッジに統合
                const edgeData = [];
                const processedPairs = new Set();

                relations.forEach(r => {
                    const key = Math.min(r.fromId, r.toId) + '-' + Math.max(r.fromId, r.toId);
                    if (processedPairs.has(key)) return;
                    processedPairs.add(key);

                    const pairRelations = pairMap.get(key);

                    function getFontSettings(label, defaultAlign = 'top') {
                        let size = 11;
                        let color = '#9d9bb8';
                        if (label.includes('付き合っている') || label.includes('夫婦')) {
                            color = '#ff4757';
                            size = 14;
                        }
                        return {
                            size: size, color: color, face: 'Noto Sans JP, sans-serif',
                            strokeWidth: 2, strokeColor: '#0f0f1a', align: defaultAlign,
                        };
                    }

                    if (pairRelations.length === 1) {
                        // 1本だけ: そのまま直線で表示
                        const rel = pairRelations[0];
                        if (rel.type === '恋人') rel.type = '付き合っている';
                        const ec = edgeColor(rel.direction, rel.type);
                        const edge = {
                            id: rel.id,
                            from: rel.fromId,
                            to: rel.toId,
                            label: rel.type,
                            color: {
                                color: ec,
                                highlight: adjustColor(ec, 30),
                                hover: adjustColor(ec, 20),
                            },
                            smooth: false,
                            font: getFontSettings(rel.type, 'top'),
                        };
                        if (rel.direction === 'from-to') {
                            edge.arrows = { to: { enabled: true, scaleFactor: 0.8, type: 'arrow' } };
                        }
                        edgeData.push(edge);
                    } else {
                        // 複数関係のグループ化
                        const minId = Math.min(pairRelations[0].fromId, pairRelations[0].toId);
                        const maxId = Math.max(pairRelations[0].fromId, pairRelations[0].toId);
                        const fromMinPerson = persons.find(p => p.id === minId);
                        const fromMaxPerson = persons.find(p => p.id === maxId);

                        // 方向別に分類
                        const biRels = pairRelations.filter(r => r.direction === 'both');
                        const toMaxRels = pairRelations.filter(r => r.direction === 'from-to' && r.fromId === minId);
                        const toMinRels = pairRelations.filter(r => r.direction === 'from-to' && r.fromId === maxId);

                        // 対向片方向（A→B かつ B→A）が共存するか
                        const hasOpposite = toMaxRels.length > 0 && toMinRels.length > 0;

                        if (hasOpposite) {
                            // ===== 対向矢印: 同じfrom/toでCW/CCWに分けて必ず別の弧に描く =====

                            // グループ1: minId→maxId — 時計回りの弧 (CW)
                            //   双方向属たすもここにまとめる
                            pairRelations.forEach(r => { if (r.type === '恋人') r.type = '付き合っている'; });

                            const g1Label = [
                                ...toMaxRels.map(r => r.type),
                                ...biRels.map(r => '↔ ' + r.type),
                            ].join('\n');
                            let g1Ec = edgeColor('from-to', g1Label);
                            if (biRels.length > 0 && toMaxRels.length === 0) g1Ec = edgeColor('both', g1Label);

                            const g1Edge = {
                                id: 'g1-' + minId + '-' + maxId,
                                from: minId, to: maxId,   // 常に minId → maxId
                                label: g1Label,
                                color: { color: g1Ec, highlight: adjustColor(g1Ec, 30), hover: adjustColor(g1Ec, 20) },
                                smooth: { type: 'curvedCW', roundness: 0.3 }, // 上側の弧
                                font: getFontSettings(g1Label, 'top'), width: 2, // 上側に配置
                                arrows: { to: { enabled: true, scaleFactor: 0.8, type: 'arrow' } },
                            };
                            edgeData.push(g1Edge);

                            // グループ2: minId←maxId — 反時計回りの弧 (CCW)
                            //   from/toは同じ(minId→maxId)だがアーローは「from」側に付ける
                            const g2Label = toMinRels.map(r => r.type).join('\n');
                            const g2Ec = edgeColor('from-to', g2Label);
                            const g2Edge = {
                                id: 'g2-' + minId + '-' + maxId,
                                from: minId, to: maxId,   // 同じ方向だが「逆矢印」で表現
                                label: g2Label,
                                color: { color: g2Ec, highlight: adjustColor(g2Ec, 30), hover: adjustColor(g2Ec, 20) },
                                smooth: { type: 'curvedCCW', roundness: 0.3 }, // 下側の弧 (逆方向)
                                font: getFontSettings(g2Label, 'bottom'), width: 2, // 下側に配置
                                arrows: { from: { enabled: true, scaleFactor: 0.8, type: 'arrow' } }, // minId側に矢印
                            };
                            edgeData.push(g2Edge);

                        } else {
                            // ===== 通常の複数関係: 1本にまとめる =====
                            pairRelations.forEach(r => { if (r.type === '恋人') r.type = '付き合っている'; });

                            const firstRel = pairRelations[0];
                            const labelLines = [
                                ...biRels.map(r => '↔ ' + r.type),
                                ...toMaxRels.map(r => r.type),
                                ...toMinRels.map(r => r.type),
                            ];
                            const combinedLabel = labelLines.join('\n');

                            const hasArrowToMax = toMaxRels.length > 0;
                            const hasArrowToMin = toMinRels.length > 0;
                            const hasBidirectional = biRels.length > 0;
                            const arrows = {};
                            if (hasArrowToMax && !hasBidirectional) arrows.to = { enabled: true, scaleFactor: 0.8, type: 'arrow' };
                            if (hasArrowToMin && !hasBidirectional) arrows.from = { enabled: true, scaleFactor: 0.8, type: 'arrow' };

                            const hasSingleDir = pairRelations.some(r => r.direction === 'from-to');
                            let mixedEc = hasSingleDir ? edgeColor('from-to', combinedLabel) : edgeColor('both', combinedLabel);

                            const edge = {
                                id: firstRel.id,
                                from: minId, to: maxId,
                                label: combinedLabel,
                                color: { color: mixedEc, highlight: adjustColor(mixedEc, 30), hover: adjustColor(mixedEc, 20) },
                                smooth: false,
                                font: getFontSettings(combinedLabel, 'top'),
                                width: 2,
                            };
                            if (Object.keys(arrows).length > 0) edge.arrows = arrows;
                            edgeData.push(edge);
                        }
                    }
                });

                // Update datasets
                const currentNodeIds = nodes.getIds();
                const newNodeIds = nodeData.map(n => n.id);
                const toRemoveNodes = currentNodeIds.filter(id => !newNodeIds.includes(id));
                const toAddNodes = nodeData.filter(n => !currentNodeIds.includes(n.id));
                const toUpdateNodes = nodeData.filter(n => currentNodeIds.includes(n.id));

                if (toRemoveNodes.length) nodes.remove(toRemoveNodes);
                if (toAddNodes.length) nodes.add(toAddNodes);
                if (toUpdateNodes.length) nodes.update(toUpdateNodes);

                // エッジは統合ロジックがあるためクリア＆再構築
                edges.clear();
                if (edgeData.length) edges.add(edgeData);
            }

            function togglePhysics() {
                physicsEnabled = !physicsEnabled;
                if (network) {
                    network.setOptions({ physics: { enabled: physicsEnabled } });
                }
                const btn = document.getElementById('btn-physics-toggle');
                btn.textContent = physicsEnabled ? '⚡' : '🔒';
                btn.title = physicsEnabled ? '物理演算OFF' : '物理演算ON';
                showToast(physicsEnabled ? '物理演算 ON' : '物理演算 OFF（ノード固定）', 'info');
            }

            // ===== Export / Import =====
            function exportData() {
                const data = {
                    version: 1,
                    exportDate: new Date().toISOString(),
                    persons,
                    relations,
                    nextPersonId,
                    nextRelationId,
                };

                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `相関図_${formatDate(new Date())}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('エクスポートしました', 'success');
            }

            function importData() {
                const textarea = document.getElementById('import-data');
                const jsonStr = textarea.value.trim();

                if (!jsonStr) {
                    showToast('JSONデータを入力してください', 'error');
                    return;
                }

                try {
                    const data = JSON.parse(jsonStr);
                    if (!data.persons || !data.relations) {
                        throw new Error('Invalid format');
                    }

                    persons = data.persons;
                    relations = data.relations;
                    nextPersonId = data.nextPersonId || (Math.max(0, ...persons.map(p => p.id)) + 1);
                    nextRelationId = data.nextRelationId || (Math.max(0, ...relations.map(r => r.id)) + 1);

                    saveData();
                    renderAll();
                    updateNetwork();

                    document.getElementById('import-modal').classList.remove('active');
                    textarea.value = '';
                    showToast('インポートしました', 'success');

                    // Fit after a short delay
                    setTimeout(() => {
                        if (network) network.fit({ animation: { duration: 500 } });
                    }, 500);

                } catch (e) {
                    showToast('JSONの解析に失敗しました', 'error');
                }
            }

            function handleFileSelect(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function (evt) {
                    document.getElementById('import-data').value = evt.target.result;
                };
                reader.readAsText(file);
                e.target.value = '';
            }

            function clearAll() {
                if (!confirm('すべてのデータを削除しますか？\nこの操作は取り消せません。')) return;

                persons = [];
                relations = [];
                nextPersonId = 1;
                nextRelationId = 1;
                saveData();
                renderAll();
                updateNetwork();
                showToast('すべてのデータを削除しました', 'info');
            }

            // ===== Helpers =====
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function adjustColor(hex, amount) {
                hex = hex.replace('#', '');
                const r = Math.max(0, Math.min(255, parseInt(hex.substring(0, 2), 16) + amount));
                const g = Math.max(0, Math.min(255, parseInt(hex.substring(2, 4), 16) + amount));
                const b = Math.max(0, Math.min(255, parseInt(hex.substring(4, 6), 16) + amount));
                return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
            }

            function formatDate(d) {
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            }

            // ===== Edit Save Functions =====
            function saveEditNode() {
                const id = parseInt(document.getElementById('edit-node-id').value);
                const newName = document.getElementById('edit-node-name').value.trim();
                const newGender = document.querySelector('#edit-node-gender-options .gender-option.active').dataset.gender;

                if (!newName) {
                    showToast('名前を入力してください', 'error');
                    return;
                }

                const person = persons.find(p => p.id === id);
                if (!person) return;

                // 重複チェック（自分以外）
                if (persons.some(p => p.id !== id && p.name === newName)) {
                    showToast('同じ名前の人物が既に存在します', 'error');
                    return;
                }

                person.name = newName;
                person.color = GENDER_COLORS[newGender] || GENDER_COLORS.none;
                person.gender = newGender;
                person.photo = editPersonPhoto;
                person.photoSize = editPersonPhoto ? editPersonPhotoSize : 35;
                person.photoOriginal = editPersonPhotoOriginal || null;
                person.photoCrop = editPersonPhoto ? { ...editPersonPhotoCrop } : { x: 0, y: 0, zoom: 100 };

                document.getElementById('edit-node-modal').classList.remove('active');
                saveData();
                renderAll();
                updateNetwork();
                showToast(`${newName} を更新しました`, 'success');
            }

            function deleteEditingNode() {
                const id = parseInt(document.getElementById('edit-node-id').value);
                deletePerson(id);
                document.getElementById('edit-node-modal').classList.remove('active');
            }

            function saveEditEdge() {
                const id = parseInt(document.getElementById('edit-edge-id').value);
                const newType = document.getElementById('edit-edge-type').value.trim();
                const newDirection = document.getElementById('edit-edge-direction').value;

                if (!newType) {
                    showToast('関係の種類を入力してください', 'error');
                    return;
                }

                const relation = relations.find(r => r.id === id);
                if (!relation) return;

                relation.type = newType;
                relation.direction = newDirection;
                relation.color = edgeColor(newDirection);

                document.getElementById('edit-edge-modal').classList.remove('active');
                saveData();
                renderAll();
                updateNetwork();
                showToast('関係を更新しました', 'success');
            }

            function deleteEditingEdge() {
                const id = parseInt(document.getElementById('edit-edge-id').value);
                const relation = relations.find(r => r.id === id);
                if (!relation) return;

                const fromPerson = persons.find(p => p.id === relation.fromId);
                const toPerson = persons.find(p => p.id === relation.toId);
                const desc = fromPerson && toPerson
                    ? `「${fromPerson.name} ↔ ${toPerson.name}」の関係「${relation.type}」`
                    : `この関係`;

                if (!confirm(`${desc}を削除しますか？`)) return;

                relations = relations.filter(r => r.id !== id);
                document.getElementById('edit-edge-modal').classList.remove('active');
                saveData();
                renderAll();
                updateNetwork();
                showToast('関係を削除しました', 'info');
            }

            // Expose to global for inline event handlers
            window.app = {
                deletePerson,
                deleteRelation,
                openEditNodeModal,
                openEditEdgeModal
            };

            // Start
            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>

</body>
